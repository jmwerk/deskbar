name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: identify the publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: build every unpublished version and push the catalog
        run: bun run publish

      # after publish, so a failed release never gets a tag; an existing tag is never moved
      - name: tag the released version
        run: |
          tag="v$(jq -r .version apps/deskbar/package.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"

      - name: refresh the browser demo
        run: bun run demo --publish
